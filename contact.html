<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="contact.css" />
</head>

<body>
    <!-- NAV -->
    <div class="nav-container">
        <div class="logo">
            <h1>Pure<span>Pour</span></h1>
        </div>
        <div class="nav">
            <a href="./index.html">Home</a>
            <a href="./products.html">Products</a>
            <a href="./about.html">About</a>
            <a class="active" href="./contact.html">Contact</a>

            <a href="" id="cart"><img src="./images/cart.svg" /></a>
        </div>
    </div>
    <hr />

    <!-- contact -->
    <div class="contact-container">
        <div class="contact">
            <h2>Contact Us</h2>
            <form>
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" name="name" placeholder="Your full Name" required />
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" placeholder="you@example.com" required />
                </div>
                <div class="form-group">
                    <label for="message">message</label>
                    <textarea name="message" placeholder="How we can help you?"></textarea>
                </div>
                <button class="submit" type="submit">Send Message</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <div class="container">
        <footer class="py-3 my-4">
            <ul class="nav justify-content-center border-bottom pb-3 mb-3">
                <li class="nav-item">
                    <a href="./index.html" class="nav-link px-2 text-body-secondary">Home</a>
                </li>
                <li class="nav-item">
                    <a href="./products.html" class="nav-link px-2 text-body-secondary">Products</a>
                </li>
                <li class="nav-item">
                    <a href="./about.html" class="nav-link px-2 text-body-secondary">About</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link px-2 text-body-secondary">Contact Us</a>
                </li>
            </ul>
            <p class="text-center text-body-secondary">
                © 2026 PurePour, Inc. All rights reserved.
            </p>
        </footer>
    </div>
    <!--  theme-->
    <div class="theme-toggle-wrap">
        <button class="theme-toggle-icon" id="theme-toggle-icon" aria-label="Toggle dark mode">
            ☀️
        </button>
    </div>
    <script src="index.js"></script>
    <script src="contact.js"></script>
</body>

</html>
